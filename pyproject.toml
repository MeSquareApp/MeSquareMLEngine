[project]
name = "mesquaremlengine"
version = "0.1.0"
description = "FastAPI template for MeSquareMLEngine"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.142.0",
    "joblib>=1.5.0",
    "lightgbm>=4.7.0",
    "orjson>=3.13.0",
    "pandas>=3.0.6",
    "polars>=2.1.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyreadstat>=1.3.6",
    "rpy2>=3.6.9",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sqlalchemy>=2.1.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=8.4.2",
    "ruff>=0.17.3",
]
ml = [
    "matplotlib>=3.11.2",
    "pyarrow>=26.0.1",
    "statsmodels>=0.15.0",
    "tqdm>=4.70.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.mypy]
python_version = "3.14"
strict = true
explicit_package_bases = true
mypy_path = "."
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["lightgbm.*", "rpy2.*", "pyreadstat.*", "sklearn.*", "scipy.*", "joblib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false
warn_return_any = false
